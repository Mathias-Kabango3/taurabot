# Phase 3: Conversation fine-tuning of shona-mt5-small.
# Sized for Kaggle T4 free tier and a 500–1000-pair conversation dataset.

model:
  base_model: "mathiaskabango/shona-mt5-small"   # Phase 2 output on HF Hub
  push_to_hub: false                              # flip true + set hub_model_id when ready
  hub_model_id: ""                                # e.g. "mathiaskabango/taurabot-shona"

data:
  pairs_path: "conversation_pairs.json"           # the hand-crafted dataset
  cache_dir: "checkpoints/taurabot-shona/tokenized_cache"
  max_input_length: 128                           # "Mubvunzo: ..." prompt
  max_target_length: 128                          # response
  validation_fraction: 0.10                       # 10% held out for best-checkpoint selection
  seed: 42

training:
  output_dir: "checkpoints/taurabot-shona"
  per_device_batch_size: 4
  gradient_accumulation_steps: 2                  # effective batch = 8 (small for 705-pair dataset)
  learning_rate: 3.0e-4                           # bigger updates to override span-corruption pretraining prior
  num_train_epochs: 200                           # upper bound — EarlyStoppingCallback will halt sooner
  warmup_ratio: 0.03                              # short warmup; lots of steps after
  weight_decay: 0.01
  logging_steps: 50
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3
  load_best_model_at_end: true                    # always keep the lowest-eval-loss checkpoint
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  fp16: true
  gradient_checkpointing: false
  seed: 42
  # Stop when eval_loss hasn't improved by `threshold` for `patience` epochs.
  # Required for long runs on tiny datasets — without it we'd overfit hard.
  early_stopping_patience: 10
  early_stopping_threshold: 0.001

# Generation config used when sampling during sanity checks (NOT during training).
generation:
  max_new_tokens: 100
  num_beams: 4
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.3
